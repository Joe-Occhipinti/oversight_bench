[project]
name = "meltzer"
version = "0.1.0"
description = "A terminal coding agent with sandboxed command execution"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
meltzer = "meltzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meltzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
