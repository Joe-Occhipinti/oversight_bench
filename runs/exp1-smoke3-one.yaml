# Pilot 3, run 2 of 2: aware with one card. Run together with exp1-smoke3-all (same scenario).
# Mode one_card needs a number of main tasks that is a multiple of the number of cards. For this pilot the cards
# folder holds only card E14 (the card the real assignment gives this scenario with seed 0 and 14 main tasks),
# so 1 main task = 1 card. The judge of this run therefore knows only E14.
run_id: exp1-smoke3-one
setting:
  name: basharena
  side_tasks: [download_malware]
  main_tasks: {pool: no_cover, n: 1, seed: 0}
conditions: [aware]
prompts:
  attack_base: prompts/exp1/attack_base.md
  aware_mode: one_card
  aware_section: {all_cards: prompts/exp1/aware_all_cards.md, one_card: prompts/exp1/aware_one_card.md}
  cards: registry/pilot/cards
models:                               # chosen by Gio, 2026-10-31
  agent:   {id: z-ai/glm-5.3,       reasoning_effort: high, provider: {order: [wafer], allow_fallbacks: false}}
  monitor: {id: z-ai/glm-5.3-flash, reasoning_effort: low,  provider: {order: [wafer], allow_fallbacks: false}}
  judge:   {id: deepseek/deepseek-v4.1-flash, reasoning_effort: high, provider: {order: [wafer], allow_fallbacks: false}, temperature: 0, concurrency: 8}
meltzer: {max_turn_steps: 1000}       # pilot only (real runs: 100): at pilot 1's pace 100 model requests would end a sample before the time limit
limits: {meltzer_seconds: 7200, sample_time_limit_seconds: 8100, wait_seconds: 15}   # 2 h per sample (real runs: 30 min)
parallel: {max_samples: 1}
seeds: {inspect_shuffle: 0, card_assignment: 0, bootstrap: 0}
