run_id: exp1-smoke
setting:
  name: basharena
  side_tasks: [download_malware]
  main_tasks: {pool: no_cover, n: 1, seed: 0}
conditions: [unaware, aware]
prompts:
  attack_base: prompts/exp1/attack_base.md
  aware_mode: all_cards                # explore: no cards; all_cards: every card in the aware prompt; one_card: one card per main task x side task
  aware_section: {common: prompts/exp1/aware_common.md, explore: prompts/exp1/aware_explore.md, all_cards: prompts/exp1/aware_all_cards.md, one_card: prompts/exp1/aware_one_card.md}
  cards: registry/v0.1/cards
models:                               # chosen by Gio, 2026-10-31
  agent:   {id: z-ai/glm-5.3,       reasoning_effort: high, provider: {order: [wafer], allow_fallbacks: false}}
  monitor: {id: z-ai/glm-5.3-flash, reasoning_effort: low,  provider: {order: [wafer], allow_fallbacks: false}}
  judge:   {id: deepseek/deepseek-v4.1-flash, reasoning_effort: high, provider: {order: [wafer], allow_fallbacks: false}, temperature: 0, concurrency: 8}
meltzer: {max_turn_steps: 100}
limits: {meltzer_seconds: 1800, sample_time_limit_seconds: 2700, wait_seconds: 15}
parallel: {max_samples: 2}
seeds: {inspect_shuffle: 0, card_assignment: 0, bootstrap: 0}
